<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartBin – Simulator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .bin-illustration {
      width: 200px;
      height: 300px;
      background: url('https://via.placeholder.com/200x300?text=SmartBin') center/contain no-repeat;
      margin: 0 auto;
      transition: transform 0.5s;
    }
    .bin-active {
      transform: translateY(-20px);
    }
    .status-box {
      min-height: 2rem;
    }
  </style>
</head>
<body id="smartbin-page" class="fade-in">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">SmartBin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="smartbin.html">SmartBin</a></li>
          <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="impact.html">Impact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <h2 class="mb-4 text-center">SmartBin Simulator (Demo)</h2>
    <div class="row g-4 justify-content-center">
      <div class="col-md-6">
        <div class="card p-3">
          <div class="card-body">
            <h5 class="card-title">Student Identification</h5>
            <p id="student-greeting" class="mb-2">Not identified. Please log in.</p>
            <button id="identify-btn" class="btn btn-primary" disabled>Identify (Demo)</button>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card p-3">
          <div class="card-body">
            <h5 class="card-title">Select Waste Category</h5>
            <select class="form-select" id="waste-category" disabled>
              <option value="wet">Wet waste (5 pts)</option>
              <option value="dry">Dry waste (5 pts)</option>
              <option value="plastic">Plastic (10 pts)</option>
              <option value="paper">Paper (5 pts)</option>
              <option value="e-waste">E‑waste (15 pts)</option>
            </select>
            <div class="mt-3 text-center">
              <div class="bin-illustration" id="bin-illustration"></div>
            </div>
            <div class="status-box text-center mt-3" id="sensor-status">Waiting for student identification...</div>
            <button id="simulate-btn" class="btn btn-success w-100 mt-3" disabled>Simulate Waste Deposit</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <footer class="bg-dark text-white text-center py-3">
    <small>&copy; 2026 SmartBin – Demo Prototype.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/smartbin.js"></script>
</body>
</html>
