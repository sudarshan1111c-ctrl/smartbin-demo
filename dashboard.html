<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartBin – Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body id="dashboard-page">
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">SmartBin</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="smartbin.html">SmartBin</a></li>
          <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
          <li class="nav-item"><a class="nav-link" href="leaderboard.html">Leaderboard</a></li>
          <li class="nav-item"><a class="nav-link" href="impact.html">Impact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="container py-5">
    <h2 class="mb-4">Welcome, <span id="student-name">Student</span></h2>
    <div class="row g-4">
      <div class="col-md-3">
        <div class="card text-center p-3">
          <h5>Total Points</h5>
          <p class="display-4" id="total-points">0</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center p-3">
          <h5>Deposits Made</h5>
          <p class="display-4" id="deposit-count">0</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center p-3">
          <h5>Waste Recycled (kg)</h5>
          <p class="display-4" id="waste-recycled">0</p>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card text-center p-3">
          <h5>Rewards Redeemed</h5>
          <p class="display-4" id="rewards-redeemed">0</p>
        </div>
      </div>
    </div>

    <h3 class="mt-5">Weekly Contribution</h3>
    <canvas id="weeklyChart" class="chart-container"></canvas>

    <h3 class="mt-4">Recent Activity</h3>
    <ul class="list-group" id="activity-list">
      <!-- Filled by JS -->
    </ul>
  </section>

  <footer class="bg-dark text-white text-center py-3">
    <small>&copy; 2026 SmartBin – Demo Prototype.</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
