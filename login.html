<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SmartBin – Student Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body id="login-page" class="d-flex align-items-center justify-content-center" style="min-height:100vh; background-color:var(--light-green);">
  <div class="card p-4" style="max-width:400px; width:100%;">
    <h3 class="text-center mb-4">Student Login</h3>
    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="username" class="form-label">College Username</label>
        <input type="text" class="form-control" id="username" required />
        <div class="invalid-feedback">Please enter your username.</div>
      </div>
      <div class="mb-3">
        <label for="studentId" class="form-label">Student ID</label>
        <input type="text" class="form-control" id="studentId" required />
        <div class="invalid-feedback">Please enter your student ID.</div>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <hr class="my-4" />
    <p class="text-muted small">Demo accounts:</p>
    <ul class="list-unstyled small">
      <li>alice / 2023001</li>
      <li>bob / 2023002</li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
